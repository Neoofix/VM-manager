name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  core:
    name: Cœur Rust (vm-core)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p vm-core --all-targets -- -D warnings
      - run: cargo test -p vm-core

  frontend:
    name: Frontend (React)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  app:
    name: Application Tauri (compilation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # tauri::generate_context! exige que frontendDist existe
      - run: mkdir -p dist
      - run: cargo clippy -p vm-manager --all-targets -- -D warnings
