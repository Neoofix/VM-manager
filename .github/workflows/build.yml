# Compilation manuelle : onglet « Actions » → « Build » → « Run workflow ».
# Produit : .msi (Windows), .deb (Debian/Ubuntu) et archives portables.
# Les fichiers sont joints à une release en brouillon (onglet « Releases »,
# visible uniquement par les mainteneurs tant qu'elle n'est pas publiée) et
# restent aussi téléchargeables en bas de la page du run (section « Artifacts »).
name: Build

on:
  workflow_dispatch:
    inputs:
      windows:
        description: "Windows x64 (.exe)"
        type: boolean
        default: true
      linux:
        description: "Linux x64"
        type: boolean
        default: true
      macos:
        description: "macOS Apple Silicon"
        type: boolean
        default: false
      draft_release:
        description: "Créer une release en brouillon avec les exécutables"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            key: windows
            os: windows-latest
            exe: vm-manager.exe
          - name: Linux x64
            key: linux
            os: ubuntu-latest
            exe: vm-manager
          - name: macOS Apple Silicon
            key: macos
            os: macos-latest
            exe: vm-manager
    steps:
      - name: Plateforme demandée ?
        id: wanted
        shell: bash
        run: echo "yes=${{ inputs[matrix.key] }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.wanted.outputs.yes == 'true'

      - uses: dtolnay/rust-toolchain@stable
        if: steps.wanted.outputs.yes == 'true'

      - uses: Swatinem/rust-cache@v2
        if: steps.wanted.outputs.yes == 'true'
        with:
          key: build-${{ matrix.key }}

      - name: Compilation (release)
        if: steps.wanted.outputs.yes == 'true'
        run: cargo build --release --locked -p vm-manager

      - name: Archive portable
        if: steps.wanted.outputs.yes == 'true'
        id: pkg
        shell: bash
        run: |
          short=$(git rev-parse --short HEAD)
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          name="vm-manager-${{ matrix.key }}-${short}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p "dist/$name"
          cp "target/release/${{ matrix.exe }}" README.md LICENSE "dist/$name/"
          cd dist
          if [ "${{ matrix.key }}" = "windows" ]; then
            7z a -tzip "$name-portable.zip" "$name" > /dev/null
          else
            # tar conserve le droit d'exécution du binaire
            tar -czf "$name-portable.tar.gz" "$name"
          fi
          rm -rf "$name"

      # ── Installateur Windows (.msi) ─────────────────────────────────────
      - name: Installation de WiX Toolset
        if: steps.wanted.outputs.yes == 'true' && matrix.key == 'windows'
        run: dotnet tool install --global wix --version 5.0.2

      - name: Installateur .msi
        if: steps.wanted.outputs.yes == 'true' && matrix.key == 'windows'
        shell: bash
        run: |
          version="${{ steps.pkg.outputs.version }}"
          wix build installer/vm-manager.wxs -arch x64 \
            -d Version="$version" \
            -d BinDir=target/release \
            -d RootDir=. \
            -d AssetsDir=crates/vm-manager/assets \
            -o "dist/VM-Manager-$version-x64.msi"
          # Fichier de débogage WiX, inutile pour l'utilisateur
          rm -f dist/*.wixpdb

      # ── Paquet Debian / Ubuntu (.deb) ───────────────────────────────────
      - name: Installation de cargo-deb
        if: steps.wanted.outputs.yes == 'true' && matrix.key == 'linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Paquet .deb
        if: steps.wanted.outputs.yes == 'true' && matrix.key == 'linux'
        run: |
          cargo deb -p vm-manager --no-build --output dist/
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - name: Fichiers produits
        if: steps.wanted.outputs.yes == 'true'
        shell: bash
        run: ls -la dist

      - uses: actions/upload-artifact@v4
        if: steps.wanted.outputs.yes == 'true'
        with:
          name: ${{ steps.pkg.outputs.name }}
          path: dist/*
          retention-days: 14
          if-no-files-found: error

  release:
    name: Release en brouillon
    needs: build
    if: inputs.draft_release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Version
        id: v
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)
          echo "tag=v${version}-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: VM Manager ${{ steps.v.outputs.tag }}
          files: dist/*
          body: |
            Build de test depuis `${{ github.ref_name }}` (commit ${{ steps.v.outputs.short }}).

            | Fichier | Usage |
            |---|---|
            | `VM-Manager-*-x64.msi` | **Windows** — installateur (Program Files + menu Démarrer). Inventaire dans `%APPDATA%\VM Manager`. |
            | `vm-manager_*_amd64.deb` | **Debian / Ubuntu** — `sudo apt install ./vm-manager_*_amd64.deb`. Inventaire dans `~/.local/share/vm-manager`. |
            | `vm-manager-windows-*-portable.zip` | Windows portable : décompresser, lancer `vm-manager.exe` (inventaire à côté). |
            | `vm-manager-linux-*-portable.tar.gz` / `vm-manager-macos-*` | Linux / macOS portable : `tar xzf …` puis `./vm-manager`. |

            Binaires non signés : sous Windows, SmartScreen → *Informations complémentaires* → *Exécuter quand même*.
