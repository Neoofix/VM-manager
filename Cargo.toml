[workspace]
resolver = "2"
members = ["crates/vm-core", "crates/vm-manager"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
log = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
