[workspace]
resolver = "2"
members = ["crates/vm-core", "crates/vm-manager"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
log = "0.4"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = "0.11"
base64 = "0.23"
zeroize = "1"
getrandom = "0.4"

# Argon2 (64 Mio) est très lent sans optimisation : on optimise ses crates même en debug
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
