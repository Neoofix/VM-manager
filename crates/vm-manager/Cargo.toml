[package]
name = "vm-manager"
description = "VM Manager - mémo et inventaire de machines virtuelles (interface egui)"
authors = ["Neoofix"]
homepage = "https://github.com/Neoofix/VM-manager"
repository = "https://github.com/Neoofix/VM-manager"
readme = "../../README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "vm-manager"
path = "src/main.rs"

[dependencies]
vm-core = { path = "../vm-core" }
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.37", features = ["monochrome_emoji_fonts"] }
rfd = "0.17"
log.workspace = true
serde.workspace = true
serde_json.workspace = true
env_logger = "0.11"
chrono.workspace = true
getrandom.workspace = true
zeroize.workspace = true

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winresource = "0.1"

# Paquet Debian / Ubuntu : `cargo deb -p vm-manager` (voir .github/workflows/build.yml)
[package.metadata.deb]
name = "vm-manager"
maintainer = "Neoofix <Neoofix@users.noreply.github.com>"
copyright = "2026, VM Manager contributors"
license-file = ["../../LICENSE", "0"]
section = "utils"
priority = "optional"
extended-description = """\
Mémo / inventaire purement informatif de machines virtuelles : groupes, \
adresses IP et détails réseau, comptes utilisateurs et informations SSH, \
enregistrés dans un fichier JSON local (~/.local/share/vm-manager)."""
# OpenGL et xkbcommon sont chargés dynamiquement à l'exécution : $auto ne les voit pas
depends = "$auto, libgl1, libxkbcommon0, libxkbcommon-x11-0"
recommends = "xdg-desktop-portal"
assets = [
    ["target/release/vm-manager", "usr/bin/", "755"],
    ["packaging/vm-manager.desktop", "usr/share/applications/", "644"],
    ["assets/icon.png", "usr/share/icons/hicolor/256x256/apps/vm-manager.png", "644"],
    ["../../README.md", "usr/share/doc/vm-manager/README.md", "644"],
]
